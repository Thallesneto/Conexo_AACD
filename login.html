<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | CoNexo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- styles.css: tokens, reset, cabeçalho e rodapé compartilhados com a tela Sobre Nós -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body class="page-login">

  <!-- Cabeçalho -->
  <header class="site-header">
    <div class="site-header__container">
      <a class="logo" href="#" aria-label="CoNexo – página inicial">
        <span class="logo__wordmark">
          <img src="assets/images/logo-conexo.png" alt="">
        </span>
        <span class="logo__mark">
          <img src="assets/images/logo-conexo.png" alt="">
        </span>
      </a>
    </div>
  </header>

  <main class="login-main">
    <a class="login-back" href="index.html" aria-label="Voltar">
      <img src="assets/icons/icon-arrow-back.svg" width="16" height="16" alt="">
    </a>

    <h1 class="login-title">Faça seu Login!</h1>

    <div class="login-panel">

      <!-- Painel visual (esquerda) -->
      <div class="login-panel__hero">
        <img class="login-panel__pattern" src="assets/icons/login-pattern.svg" alt="">
        <img class="login-panel__photo" src="assets/images/login-hero.png"
             alt="Profissional de reabilitação ajustando uma prótese em uma paciente">
      </div>

      <!-- Área de interação (direita) -->
      <div class="login-panel__form-area">
        <form class="login-form" action="#" method="post">

          <!-- Seleção de perfil: apenas uma opção marcada por vez -->
          <fieldset class="profile-tabs">
            <legend class="visually-hidden">Tipo de acesso</legend>

            <input class="profile-tabs__input" type="radio" name="perfil"
                   id="perfil-equipe" value="equipe-aacd" checked>
            <label class="profile-tabs__tab" for="perfil-equipe">Equipe AACD</label>

            <input class="profile-tabs__input" type="radio" name="perfil"
                   id="perfil-parceiro" value="parceiro">
            <label class="profile-tabs__tab" for="perfil-parceiro">Parceiro</label>
          </fieldset>

          <div class="login-form__fields">

            <div class="field">
              <label class="field__label" for="email">E-mail Institucional</label>
              <div class="field__control">
                <input class="field__input" type="email" id="email" name="email"
                       placeholder="exemplo@aacd.org.br ou lab@empresa.com"
                       autocomplete="username" required>
                <img class="field__icon"
                     src="assets/icons/icon-email.svg" width="13.33" height="10.67" alt="">
              </div>
            </div>

            <div class="field">
              <div class="field__header">
                <label class="field__label" for="senha">Senha</label>
                <a class="field__link" href="#">Esqueci minha senha</a>
              </div>
              <div class="field__control">
                <input class="field__input" type="password" id="senha" name="senha"
                       placeholder="••••••••••••"
                       autocomplete="current-password" required>
                <button class="field__toggle" type="button"
                        aria-label="Mostrar senha" aria-pressed="false">
                  <img src="assets/icons/icon-password-eye.svg" width="14.67" height="10" alt="">
                </button>
              </div>
            </div>

            <div class="remember">
              <input class="remember__checkbox" type="checkbox" id="lembrar" name="lembrar">
              <label class="remember__label" for="lembrar">Lembrar este dispositivo institucional</label>
            </div>

            <button class="login-submit" type="submit">
              <img src="assets/icons/icon-lock.svg" width="10.67" height="14" alt="">
              <span>Entrar no Sistema</span>
            </button>

          </div>
        </form>
      </div>

    </div>
  </main>

  <!-- Rodapé -->
  <footer class="site-footer">
    <h2 class="site-footer__title">Parceiros:</h2>

    <div class="site-footer__logos">
      <div class="partner-logo partner-logo--maua" role="img" aria-label="Instituto Mauá de Tecnologia">
        <span class="partner-logo__mask"></span>
      </div>

      <div class="site-footer__divider" aria-hidden="true">
        <div class="site-footer__divider-rotator">
          <div class="site-footer__divider-line">
            <img src="assets/icons/divider-line.svg" alt="">
          </div>
        </div>
      </div>

      <div class="partner-logo partner-logo--aacd" role="img" aria-label="AACD">
        <img src="assets/images/logo-aacd.png" alt="">
      </div>
    </div>
  </footer>

</body>
</html>
